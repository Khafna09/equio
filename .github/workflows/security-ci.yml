name: Security CI

on:
  push:
    branches: [main, develop, 'codex/feature/**', 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        run: bash ./mvnw --batch-mode test
      - name: Build production container
        run: docker build --tag equio-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: https://api.example.test/api/v1
    defaults:
      run:
        working-directory: equio_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: equio_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run test
      - name: Test production monitor and bounded load tooling
        working-directory: .
        run: node --test .github/scripts/monitor-production.test.mjs .github/scripts/load-smoke.test.mjs
      - run: npm run build
      - name: Verify Cloudflare deployment artifacts
        run: |
          test -f dist/_headers
          test ! -e dist/_redirects
          test ! -e dist/404.html
          grep -F "Content-Security-Policy:" dist/_headers
          grep -F "https://api.example.test" dist/_headers
          grep -F "! Cache-Control" dist/_headers
      - run: npm audit --audit-level=high

  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: equio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d equio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://localhost:5432/equio?sslmode=disable
      DB_MIGRATION_URL: jdbc:postgresql://localhost:5432/equio?sslmode=disable
      DB_APP_USERNAME: equio_app
      DB_APP_PASSWORD: app-ci-password
      DB_MIGRATION_USERNAME: postgres
      DB_MIGRATION_PASSWORD: postgres-ci-password
      JWT_SECRET_BASE64: Y2ktand0LXNlY3JldC10aGF0LWlzLWxvbmdlci10aGFuLTMyeC0wMDAwMDAwMDA=
      METADATA_HASH_KEY_BASE64: Y2ktbWV0YWRhdGEta2V5LXRoYXQtaXMtbG9uZ2VyLXRoYW4tMzJ4LTExMTExMTExMQ==
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SWAGGER_PUBLIC: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and prepare PostgreSQL driver
        run: |
          bash ./mvnw --batch-mode package -DskipTests
          bash ./mvnw --batch-mode dependency:copy-dependencies -DincludeArtifactIds=postgresql -DoutputDirectory=target/dependency
      - name: Create least-privileged runtime role
        run: java --class-path "target/dependency/*" scripts/DatabaseRoleSetup.java
      - name: Start API and apply Flyway migrations
        run: |
          java -jar target/backend-*.jar > ../backend-integration.log 2>&1 &
          echo $! > ../backend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8081/actuator/health/liveness; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify grants, RLS and HTTP security controls
        run: |
          java --class-path "target/dependency/*" scripts/DatabaseSecurityCheck.java
          java --class-path "target/dependency/*" scripts/FinancialIntegritySmokeTest.java
          java --class-path "target/dependency/*" scripts/SecuritySmokeTest.java
      - name: Verify cycles and query limits against real PostgreSQL
        env:
          TEST_PG_JOBS: "true"
        run: bash ./mvnw --batch-mode test -Dtest=BudgetCyclePostgresTest,DatabaseLimitsPostgresTest,MovementPaginationPostgresTest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: equio_frontend/package-lock.json
      - name: Prepare browser regressions
        working-directory: equio_frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Restart disposable API for browser regressions
        run: |
          kill $(cat ../backend.pid)
          for attempt in {1..30}; do
            if ! kill -0 $(cat ../backend.pid) 2>/dev/null; then
              break
            fi
            sleep 1
          done
          # Raised auth limits are test-only; the security smoke already verified defaults.
          java -jar target/backend-*.jar \
            --app.jobs.budgets.enabled=false \
            --app.security.login-rate-limit-per-minute=100 \
            --app.security.sign-up-rate-limit-per-minute=100 \
            --app.cors.allowed-origins=http://localhost:5178 > ../backend-e2e.log 2>&1 &
          echo $! > ../backend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8081/actuator/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify browser authentication, isolation and movements
        working-directory: equio_frontend
        env:
          E2E_BASE_URL: http://localhost:5178
          E2E_API_BASE_URL: http://localhost:8081/api/v1
        run: npm run test:e2e
      - name: Print API log on failure
        if: failure()
        working-directory: .
        run: |
          for log in backend-integration.log backend-e2e.log; do
            if test -f "$log"; then cat "$log"; fi
          done
      - name: Stop API
        if: always()
        working-directory: .
        run: |
          if test -f backend.pid; then
            kill $(cat backend.pid) || true
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
