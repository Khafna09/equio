spring:
  main:
    banner-mode: "off"
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
  flyway:
    clean-disabled: true
    baseline-on-migrate: false

server:
  forward-headers-strategy: framework

app:
  refresh-token:
    cookie-secure: true
  security:
    require-https: true
    swagger-public: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
